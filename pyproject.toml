[project]
name = "coding_assistant"
version = "0.1.0"
description = "Coding_Assistant using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.6,<2.0.0"
]

[project.scripts]
coding_assistant = "coding_assistant.main:run"
run_crew = "coding_assistant.main:run"
train = "coding_assistant.main:train"
replay = "coding_assistant.main:replay"
test = "coding_assistant.main:test"
run_with_trigger = "coding_assistant.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
